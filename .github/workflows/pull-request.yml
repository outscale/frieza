name: pull-request

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: 📦 Build
      run: make build
    - name: 🔎 Lint
      uses: outscale/goutils/.github/actions/lint@41f4efe660776303c374791006ab8d4dedf0f608 # v1.0.2
    - name: 👮 Reuse
      run: make test-reuse
